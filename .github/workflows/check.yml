name: Project checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-terrain.lock.txt
      - run: python scripts/build_english.py
      - run: git diff --exit-code -- static/en
      - run: python -m unittest discover -v
      - run: python scripts/check_assets.py
      - run: python scripts/audit_secrets.py
